<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Love Beat</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 68% 45%, rgba(32, 0, 18, 0.24), transparent 34%),
        radial-gradient(circle at 38% 46%, rgba(36, 0, 24, 0.18), transparent 42%),
        #000;
      font-family: Arial, sans-serif;
    }

    body {
      position: relative;
    }

    canvas {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: block;
      width: 100%;
      height: 100%;
    }

  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    let width = 0;
    let height = 0;
    let dpr = Math.min(window.devicePixelRatio || 1, 2);
    let time = 0;
    let puppyCanvas = null;

    const puppyImage = new Image();
    const heartParticles = [];

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      dpr = Math.min(window.devicePixelRatio || 1, 2);

      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = width + "px";
      canvas.style.height = height + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function heartPoint(t, scale = 1) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y =
        13 * Math.cos(t) -
        5 * Math.cos(2 * t) -
        2 * Math.cos(3 * t) -
        Math.cos(4 * t);
      return { x: x * scale, y: -y * scale };
    }

    function rand(min, max) {
      return Math.random() * (max - min) + min;
    }

    function removeOldHeartPixel(x, y) {
      if (x < 18 || x > 108 || y < 76 || y > 182) return false;

      const leftLobe = ((x - 46) / 32) ** 2 + ((y - 115) / 34) ** 2 < 1.22;
      const rightLobe = ((x - 74) / 35) ** 2 + ((y - 112) / 36) ** 2 < 1.18;
      const lowerPoint = y >= 116 && y <= 182 && Math.abs(x - (61 + (y - 128) * 0.09)) < (182 - y) * 0.58 + 8;

      return leftLobe || rightLobe || lowerPoint;
    }

    function preparePuppyImage() {
      const source = document.createElement("canvas");
      source.width = puppyImage.naturalWidth;
      source.height = puppyImage.naturalHeight;

      const sourceCtx = source.getContext("2d");
      sourceCtx.drawImage(puppyImage, 0, 0);

      const imageData = sourceCtx.getImageData(0, 0, source.width, source.height);
      const data = imageData.data;

      for (let y = 0; y < source.height; y++) {
        for (let x = 0; x < source.width; x++) {
          const i = (y * source.width + x) * 4;
          const isWhiteBackground = data[i] > 245 && data[i + 1] > 245 && data[i + 2] > 245;

          if (isWhiteBackground || removeOldHeartPixel(x, y)) {
            data[i + 3] = 0;
          }
        }
      }

      sourceCtx.putImageData(imageData, 0, 0);
      puppyCanvas = source;
    }

    function makeHeartParticles() {
      heartParticles.length = 0;

      for (let i = 0; i < 1500; i++) {
        const t = Math.random() * Math.PI * 2;
        const edgeParticle = Math.random() < 0.62;
        const scale = edgeParticle ? rand(3.9, 4.7) : rand(3.0, 5.8);
        const p = heartPoint(t, scale);

        heartParticles.push({
          x: p.x + rand(-6.5, 6.5),
          y: p.y + rand(-7.5, 7.5),
          size: edgeParticle ? rand(1.1, 2.2) : rand(0.7, 1.8),
          alpha: edgeParticle ? rand(0.58, 0.96) : rand(0.18, 0.62),
          drift: rand(0, Math.PI * 2),
          light: Math.random() < 0.42,
        });
      }
    }

    function drawBackground() {
      const g = ctx.createRadialGradient(
        width * 0.66,
        height * 0.48,
        20,
        width / 2,
        height / 2,
        Math.max(width, height) * 0.75
      );
      g.addColorStop(0, "rgba(32, 0, 18, 0.24)");
      g.addColorStop(0.55, "rgba(10, 0, 8, 0.10)");
      g.addColorStop(1, "rgba(0, 0, 0, 1)");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, width, height);
    }

    function getPuppyFrame() {
      if (width <= 620) {
        const size = Math.min(width * 0.78, height * 0.52, 320);
        return {
          x: width * 0.5,
          y: height * 0.55,
          size,
        };
      }

      const size = Math.min(width * 0.34, height * 0.56, 390);
      return {
        x: width * 0.55,
        y: height * 0.53,
        size,
      };
    }

    function drawPuppyBody(frame) {
      if (!puppyCanvas) return;

      const left = frame.x - frame.size / 2;
      const top = frame.y - frame.size / 2;

      ctx.save();
      ctx.shadowBlur = 26;
      ctx.shadowColor = "rgba(255, 120, 190, 0.36)";
      ctx.drawImage(puppyCanvas, left, top, frame.size, frame.size);
      ctx.restore();
    }

    function drawParticleHeart(frame, beat) {
      const x = frame.x - frame.size * 0.245;
      const y = frame.y + frame.size * 0.01;
      const scale = (frame.size / 240) * beat;

      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);

      for (const p of heartParticles) {
        const flicker = 0.78 + 0.22 * Math.sin(time * 5 + p.drift);
        const px = p.x + Math.cos(time * 1.1 + p.drift) * 1.7;
        const py = p.y + Math.sin(time * 1.3 + p.drift) * 1.7;

        ctx.beginPath();
        ctx.arc(px, py, p.size, 0, Math.PI * 2);
        ctx.fillStyle = p.light
          ? `rgba(255, 211, 238, ${p.alpha * flicker})`
          : `rgba(255, 62, 160, ${p.alpha * flicker})`;
        ctx.shadowBlur = 8;
        ctx.shadowColor = "rgba(255, 80, 170, 0.85)";
        ctx.fill();
      }

      ctx.restore();
    }

    function drawHoldingPaw(frame) {
      const x = frame.x;
      const y = frame.y;
      const s = frame.size / 240;

      ctx.save();
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.strokeStyle = "#050505";
      ctx.lineWidth = 6.5 * s;
      ctx.shadowBlur = 4 * s;
      ctx.shadowColor = "rgba(0, 0, 0, 0.55)";

      ctx.beginPath();
      ctx.moveTo(x - frame.size * 0.08, y + frame.size * 0.025);
      ctx.quadraticCurveTo(x - frame.size * 0.17, y + frame.size * 0.02, x - frame.size * 0.245, y - frame.size * 0.035);
      ctx.stroke();

      ctx.strokeStyle = "#f1d49b";
      ctx.lineWidth = 3.6 * s;
      ctx.beginPath();
      ctx.moveTo(x - frame.size * 0.085, y + frame.size * 0.018);
      ctx.quadraticCurveTo(x - frame.size * 0.17, y + frame.size * 0.014, x - frame.size * 0.238, y - frame.size * 0.032);
      ctx.stroke();

      ctx.restore();
    }

    function animate() {
      time += 0.016;
      ctx.clearRect(0, 0, width, height);
      drawBackground();

      const beat =
        1 +
        0.055 * Math.sin(time * 2.4) +
        0.018 * Math.sin(time * 4.8);

      const frame = getPuppyFrame();
      drawPuppyBody(frame);
      drawParticleHeart(frame, beat);
      drawHoldingPaw(frame);

      requestAnimationFrame(animate);
    }

    resize();
    makeHeartParticles();
    animate();

    puppyImage.addEventListener("load", preparePuppyImage);
    puppyImage.src = "下載.png";

    if (puppyImage.complete && puppyImage.naturalWidth > 0) {
      preparePuppyImage();
    }

    window.addEventListener("resize", () => {
      resize();
    });
  </script>
</body>
</html>
