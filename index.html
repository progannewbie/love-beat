<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Love Beat</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 68% 45%, rgba(32, 0, 18, 0.24), transparent 34%),
        radial-gradient(circle at 38% 46%, rgba(36, 0, 24, 0.18), transparent 42%),
        #000;
      font-family: Arial, sans-serif;
    }

    body {
      position: relative;
    }

    canvas {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    let width = 0;
    let height = 0;
    let dpr = Math.min(window.devicePixelRatio || 1, 2);
    let time = 0;

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      dpr = Math.min(window.devicePixelRatio || 1, 2);

      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = width + "px";
      canvas.style.height = height + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function heartPoint(t, scale = 1) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y =
        13 * Math.cos(t) -
        5 * Math.cos(2 * t) -
        2 * Math.cos(3 * t) -
        Math.cos(4 * t);
      return { x: x * scale, y: -y * scale };
    }

    function drawBackground() {
      const g = ctx.createRadialGradient(
        width * 0.66,
        height * 0.48,
        20,
        width / 2,
        height / 2,
        Math.max(width, height) * 0.75
      );
      g.addColorStop(0, "rgba(32, 0, 18, 0.24)");
      g.addColorStop(0.55, "rgba(10, 0, 8, 0.10)");
      g.addColorStop(1, "rgba(0, 0, 0, 1)");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, width, height);
    }

    function getHeldHeartPosition() {
      if (width <= 620) {
        const dogSize = Math.min(width * 0.72, 300);
        return {
          dogX: width * 0.55,
          dogY: height * 0.59,
          heartX: width * 0.55 - dogSize * 0.3,
          heartY: height * 0.59 - dogSize * 0.03,
          scale: dogSize / 520,
          dogSize,
        };
      }

      const dogSize = width <= 900 ? Math.min(width * 0.36, 250) : Math.min(width * 0.28, 330);
      const dogX = width <= 900 ? width * 0.57 : width * 0.58;
      const dogY = height * 0.56;

      return {
        dogX,
        dogY,
        heartX: dogX - dogSize * 0.33,
        heartY: dogY - dogSize * 0.03,
        scale: dogSize / 520,
        dogSize,
      };
    }

    function drawDogBack(cx, centerY, dogSize) {
      const s = dogSize / 360;
      const dogTop = centerY - dogSize * 0.5;
      const line = 12 * s;

      ctx.save();
      ctx.lineWidth = line;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.strokeStyle = "#050505";
      ctx.shadowBlur = 18 * s;
      ctx.shadowColor = "rgba(255, 120, 190, 0.16)";

      ctx.fillStyle = "#efd090";
      ctx.beginPath();
      ctx.ellipse(cx - dogSize * 0.25, dogTop + dogSize * 0.16, dogSize * 0.12, dogSize * 0.17, -0.75, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.beginPath();
      ctx.ellipse(cx + dogSize * 0.18, dogTop + dogSize * 0.12, dogSize * 0.1, dogSize * 0.16, 0.42, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#f2d39b";
      ctx.beginPath();
      ctx.roundRect(cx - dogSize * 0.23, dogTop + dogSize * 0.22, dogSize * 0.46, dogSize * 0.58, dogSize * 0.14);
      ctx.fill();
      ctx.stroke();

      ctx.strokeStyle = "#ff6165";
      ctx.lineWidth = 7 * s;
      ctx.beginPath();
      ctx.moveTo(cx - dogSize * 0.16, dogTop + dogSize * 0.44);
      ctx.quadraticCurveTo(cx, dogTop + dogSize * 0.46, cx + dogSize * 0.18, dogTop + dogSize * 0.43);
      ctx.stroke();

      ctx.fillStyle = "#050505";
      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.arc(cx - dogSize * 0.1, dogTop + dogSize * 0.34, dogSize * 0.018, 0, Math.PI * 2);
      ctx.arc(cx + dogSize * 0.1, dogTop + dogSize * 0.34, dogSize * 0.018, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.ellipse(cx, dogTop + dogSize * 0.37, dogSize * 0.026, dogSize * 0.019, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "#050505";
      ctx.lineWidth = 7 * s;
      ctx.beginPath();
      ctx.moveTo(cx, dogTop + dogSize * 0.38);
      ctx.lineTo(cx, dogTop + dogSize * 0.41);
      ctx.quadraticCurveTo(cx - dogSize * 0.055, dogTop + dogSize * 0.45, cx - dogSize * 0.11, dogTop + dogSize * 0.41);
      ctx.moveTo(cx, dogTop + dogSize * 0.41);
      ctx.quadraticCurveTo(cx + dogSize * 0.055, dogTop + dogSize * 0.45, cx + dogSize * 0.11, dogTop + dogSize * 0.41);
      ctx.stroke();

      ctx.restore();
    }

    function drawDogFrontPaws(cx, centerY, dogSize) {
      const s = dogSize / 360;
      const dogTop = centerY - dogSize * 0.5;

      ctx.save();
      ctx.strokeStyle = "#050505";
      ctx.lineWidth = 13 * s;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.shadowBlur = 10 * s;
      ctx.shadowColor = "rgba(0, 0, 0, 0.35)";

      ctx.beginPath();
      ctx.moveTo(cx - dogSize * 0.22, dogTop + dogSize * 0.52);
      ctx.quadraticCurveTo(cx - dogSize * 0.35, dogTop + dogSize * 0.53, cx - dogSize * 0.42, dogTop + dogSize * 0.48);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(cx - dogSize * 0.04, dogTop + dogSize * 0.55);
      ctx.quadraticCurveTo(cx - dogSize * 0.13, dogTop + dogSize * 0.56, cx - dogSize * 0.2, dogTop + dogSize * 0.5);
      ctx.stroke();

      ctx.strokeStyle = "rgba(242, 211, 155, 0.82)";
      ctx.lineWidth = 7 * s;
      ctx.beginPath();
      ctx.moveTo(cx - dogSize * 0.21, dogTop + dogSize * 0.515);
      ctx.quadraticCurveTo(cx - dogSize * 0.34, dogTop + dogSize * 0.515, cx - dogSize * 0.4, dogTop + dogSize * 0.475);
      ctx.moveTo(cx - dogSize * 0.045, dogTop + dogSize * 0.54);
      ctx.quadraticCurveTo(cx - dogSize * 0.13, dogTop + dogSize * 0.54, cx - dogSize * 0.185, dogTop + dogSize * 0.495);
      ctx.stroke();

      ctx.restore();
    }

    function drawFilledHeart(cx, cy, beat, scale) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(scale * beat, scale * beat);
      ctx.beginPath();
      for (let t = 0; t <= Math.PI * 2 + 0.01; t += 0.02) {
        const p = heartPoint(t, 10.8);
        if (t === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      }
      ctx.closePath();

      const fill = ctx.createLinearGradient(0, -120, 0, 120);
      fill.addColorStop(0, "#ff8d91");
      fill.addColorStop(0.58, "#ff686d");
      fill.addColorStop(1, "#e84c56");

      ctx.shadowBlur = 18;
      ctx.shadowColor = "rgba(255, 104, 109, 0.7)";
      ctx.fillStyle = fill;
      ctx.fill();

      ctx.shadowBlur = 0;
      ctx.lineWidth = 10;
      ctx.strokeStyle = "#050505";
      ctx.stroke();
      ctx.restore();
    }

    function animate() {
      time += 0.016;
      ctx.clearRect(0, 0, width, height);
      drawBackground();

      const beat =
        1 +
        0.032 * Math.sin(time * 2.4) +
        0.014 * Math.sin(time * 4.8) +
        0.006 * Math.sin(time * 9.6);

      const heldHeart = getHeldHeartPosition();
      drawDogBack(heldHeart.dogX, heldHeart.dogY, heldHeart.dogSize);
      drawFilledHeart(heldHeart.heartX, heldHeart.heartY, beat, heldHeart.scale);
      drawDogFrontPaws(heldHeart.dogX, heldHeart.dogY, heldHeart.dogSize);
      requestAnimationFrame(animate);
    }

    resize();
    animate();

    window.addEventListener("resize", () => {
      resize();
    });
  </script>
</body>
</html>
