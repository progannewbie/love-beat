<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Love Beat</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    canvas {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
    }

    .scene {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }

    .dog {
      position: absolute;
      right: 12%;
      top: 50%;
      width: min(26vw, 320px);
      transform: translateY(-48%);
      filter: drop-shadow(0 0 16px rgba(255, 120, 190, 0.16));
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    @media (max-width: 900px) {
      .dog {
        right: 6%;
        width: min(34vw, 250px);
      }
    }
  </style>
</head>
<body>
  <div class="scene">
    <canvas id="canvas"></canvas>
    <img class="dog" src="dog.png" alt="dog" />
  </div>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    let width = 0;
    let height = 0;
    let dpr = Math.min(window.devicePixelRatio || 1, 2);
    let time = 0;

    const edgeParticles = [];
    const glowParticles = [];
    const dustParticles = [];

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = width + "px";
      canvas.style.height = height + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function heartPoint(t, scale = 1) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y =
        13 * Math.cos(t) -
        5 * Math.cos(2 * t) -
        2 * Math.cos(3 * t) -
        Math.cos(4 * t);
      return { x: x * scale, y: -y * scale };
    }

    function rand(min, max) {
      return Math.random() * (max - min) + min;
    }

    function makeParticles() {
      edgeParticles.length = 0;
      glowParticles.length = 0;
      dustParticles.length = 0;

      for (let i = 0; i < 1800; i++) {
        const t = Math.random() * Math.PI * 2;
        const p = heartPoint(t, 10.8);
        edgeParticles.push({
          baseX: p.x,
          baseY: p.y,
          offset: rand(-3, 3),
          drift: rand(0, Math.PI * 2),
          size: rand(1.3, 2.5),
          alpha: rand(0.55, 0.98),
          colorType: Math.floor(rand(0, 3)),
        });
      }

      for (let i = 0; i < 900; i++) {
        const t = Math.random() * Math.PI * 2;
        const p = heartPoint(t, rand(10.3, 11.8));
        glowParticles.push({
          baseX: p.x + rand(-8, 8),
          baseY: p.y + rand(-8, 8),
          drift: rand(0, Math.PI * 2),
          size: rand(0.8, 1.8),
          alpha: rand(0.12, 0.28),
          colorType: Math.floor(rand(0, 3)),
        });
      }

      for (let i = 0; i < 300; i++) {
        const angle = Math.random() * Math.PI * 2;
        const radius = rand(55, 110);
        dustParticles.push({
          angle,
          radius,
          size: rand(0.8, 1.8),
          alpha: rand(0.06, 0.16),
          colorType: Math.floor(rand(0, 2)),
        });
      }
    }

    function getColor(type, alpha) {
      if (type === 0) return `rgba(255, 120, 190, ${alpha})`;
      if (type === 1) return `rgba(255, 175, 220, ${alpha})`;
      return `rgba(255, 235, 245, ${alpha})`;
    }

    function drawBackground() {
      const g = ctx.createRadialGradient(
        width / 2,
        height / 2,
        30,
        width / 2,
        height / 2,
        Math.max(width, height) * 0.72
      );
      g.addColorStop(0, "rgba(28, 0, 18, 0.18)");
      g.addColorStop(0.55, "rgba(8, 0, 8, 0.10)");
      g.addColorStop(1, "rgba(0, 0, 0, 1)");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, width, height);
    }

    function drawParticleHeart(cx, cy, beat) {
      for (const p of glowParticles) {
        const moveX = Math.cos(time * 0.8 + p.drift) * 1.8;
        const moveY = Math.sin(time * 0.8 + p.drift) * 1.8;
        const x = cx + (p.baseX + moveX) * beat;
        const y = cy + (p.baseY + moveY) * beat;
        ctx.beginPath();
        ctx.arc(x, y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = getColor(p.colorType, p.alpha);
        ctx.shadowBlur = 14;
        ctx.shadowColor = getColor(p.colorType, Math.min(1, p.alpha + 0.18));
        ctx.fill();
      }

      for (const p of edgeParticles) {
        const jitterX = Math.cos(time * 1.4 + p.drift) * p.offset * 0.2;
        const jitterY = Math.sin(time * 1.7 + p.drift) * p.offset * 0.2;
        const x = cx + (p.baseX + jitterX) * beat;
        const y = cy + (p.baseY + jitterY) * beat;
        ctx.beginPath();
        ctx.arc(x, y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = getColor(p.colorType, p.alpha);
        ctx.shadowBlur = 9;
        ctx.shadowColor = getColor(p.colorType, Math.min(1, p.alpha + 0.14));
        ctx.fill();
      }

      for (const p of dustParticles) {
        const swirl = time * 0.08 + p.angle;
        const x = cx + Math.cos(swirl) * p.radius;
        const y = cy + Math.sin(swirl) * p.radius * 0.72;
        ctx.beginPath();
        ctx.arc(x, y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = getColor(p.colorType, p.alpha);
        ctx.shadowBlur = 6;
        ctx.shadowColor = getColor(p.colorType, p.alpha);
        ctx.fill();
      }
    }

    function animate() {
      time += 0.016;
      ctx.clearRect(0, 0, width, height);
      drawBackground();

      const beat =
        1 +
        0.035 * Math.sin(time * 2.4) +
        0.016 * Math.sin(time * 4.8) +
        0.008 * Math.sin(time * 9.6);

      const heartX = width * 0.30;
      const heartY = height * 0.46;
      drawParticleHeart(heartX, heartY, beat);

      requestAnimationFrame(animate);
    }

    resize();
    makeParticles();
    animate();
    window.addEventListener("resize", () => {
      resize();
      makeParticles();
    });
  </script>
</body>
</html>
