<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Love Beat</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    let width = 0;
    let height = 0;
    let dpr = Math.min(window.devicePixelRatio || 1, 2);
    let time = 0;

    const edgeParticles = [];
    const glowParticles = [];
    const dustParticles = [];

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = width + "px";
      canvas.style.height = height + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function heartPoint(t, scale = 1) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y =
        13 * Math.cos(t) -
        5 * Math.cos(2 * t) -
        2 * Math.cos(3 * t) -
        Math.cos(4 * t);
      return { x: x * scale, y: -y * scale };
    }

    function rand(min, max) {
      return Math.random() * (max - min) + min;
    }

    function makeParticles() {
      edgeParticles.length = 0;
      glowParticles.length = 0;
      dustParticles.length = 0;

      for (let i = 0; i < 1800; i++) {
        const t = Math.random() * Math.PI * 2;
        const p = heartPoint(t, 10.8);
        edgeParticles.push({
          baseX: p.x,
          baseY: p.y,
          offset: rand(-3, 3),
          drift: rand(0, Math.PI * 2),
          size: rand(1.3, 2.5),
          alpha: rand(0.55, 0.98),
          colorType: Math.floor(rand(0, 3)),
        });
      }

      for (let i = 0; i < 900; i++) {
        const t = Math.random() * Math.PI * 2;
        const p = heartPoint(t, rand(10.3, 11.8));
        glowParticles.push({
          baseX: p.x + rand(-8, 8),
          baseY: p.y + rand(-8, 8),
          drift: rand(0, Math.PI * 2),
          size: rand(0.8, 1.8),
          alpha: rand(0.12, 0.28),
          colorType: Math.floor(rand(0, 3)),
        });
      }

      for (let i = 0; i < 300; i++) {
        const angle = Math.random() * Math.PI * 2;
        const radius = rand(55, 110);
        dustParticles.push({
          angle,
          radius,
          size: rand(0.8, 1.8),
          alpha: rand(0.06, 0.16),
          colorType: Math.floor(rand(0, 2)),
        });
      }
    }

    function getColor(type, alpha) {
      if (type === 0) return `rgba(255, 120, 190, ${alpha})`;
      if (type === 1) return `rgba(255, 175, 220, ${alpha})`;
      return `rgba(255, 235, 245, ${alpha})`;
    }

    function drawBackground() {
      const g = ctx.createRadialGradient(
        width / 2,
        height / 2,
        30,
        width / 2,
        height / 2,
        Math.max(width, height) * 0.72
      );
      g.addColorStop(0, "rgba(28, 0, 18, 0.18)");
      g.addColorStop(0.55, "rgba(8, 0, 8, 0.10)");
      g.addColorStop(1, "rgba(0, 0, 0, 1)");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, width, height);
    }

    function drawParticleHeart(cx, cy, beat) {
      for (const p of glowParticles) {
        const moveX = Math.cos(time * 0.8 + p.drift) * 1.8;
        const moveY = Math.sin(time * 0.8 + p.drift) * 1.8;
        const x = cx + (p.baseX + moveX) * beat;
        const y = cy + (p.baseY + moveY) * beat;
        ctx.beginPath();
        ctx.arc(x, y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = getColor(p.colorType, p.alpha);
        ctx.shadowBlur = 14;
        ctx.shadowColor = getColor(p.colorType, Math.min(1, p.alpha + 0.18));
        ctx.fill();
      }

      for (const p of edgeParticles) {
        const jitterX = Math.cos(time * 1.4 + p.drift) * p.offset * 0.2;
        const jitterY = Math.sin(time * 1.7 + p.drift) * p.offset * 0.2;
        const x = cx + (p.baseX + jitterX) * beat;
        const y = cy + (p.baseY + jitterY) * beat;
        ctx.beginPath();
        ctx.arc(x, y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = getColor(p.colorType, p.alpha);
        ctx.shadowBlur = 9;
        ctx.shadowColor = getColor(p.colorType, Math.min(1, p.alpha + 0.14));
        ctx.fill();
      }

      for (const p of dustParticles) {
        const swirl = time * 0.08 + p.angle;
        const x = cx + Math.cos(swirl) * p.radius;
        const y = cy + Math.sin(swirl) * p.radius * 0.72;
        ctx.beginPath();
        ctx.arc(x, y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = getColor(p.colorType, p.alpha);
        ctx.shadowBlur = 6;
        ctx.shadowColor = getColor(p.colorType, p.alpha);
        ctx.fill();
      }
    }

    function drawPuppy(x, y, scale, cuddle) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      const line = "#171717";
      const fur = "#e3c28e";
      const ear = "#d8ab70";
      const collar = "#ff8ca3";
      const bob = Math.sin(time * 2.8) * 1.5;
      const pawLift = 4 + cuddle * 5;

      ctx.lineWidth = 4;
      ctx.strokeStyle = line;
      ctx.fillStyle = fur;

      ctx.beginPath();
      ctx.ellipse(0, 14 + bob, 42, 36, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.beginPath();
      ctx.ellipse(0, -38 + bob, 38, 32, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = ear;
      ctx.beginPath();
      ctx.ellipse(-22, -72 + bob, 12, 23, -0.28, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.beginPath();
      ctx.ellipse(22, -72 + bob, 12, 23, 0.28, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = fur;
      ctx.beginPath();
      ctx.ellipse(-22, 58 + bob, 9, 20, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.beginPath();
      ctx.ellipse(2, 60 + bob, 9, 20, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.beginPath();
      ctx.ellipse(-22, 28 - pawLift + bob, 9, 19, -0.45, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.beginPath();
      ctx.ellipse(22, 28 - pawLift + bob, 9, 19, 0.45, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.lineWidth = 3;
      ctx.strokeStyle = collar;
      ctx.beginPath();
      ctx.moveTo(-21, -14 + bob);
      ctx.quadraticCurveTo(0, -8 + bob, 21, -14 + bob);
      ctx.stroke();

      ctx.fillStyle = line;
      ctx.beginPath();
      ctx.arc(-10, -42 + bob, 3.2, 0, Math.PI * 2);
      ctx.arc(10, -42 + bob, 3.2, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.arc(0, -30 + bob, 3.8, 0, Math.PI * 2);
      ctx.fill();

      ctx.lineWidth = 3;
      ctx.strokeStyle = line;
      ctx.beginPath();
      ctx.moveTo(0, -26 + bob);
      ctx.quadraticCurveTo(-6, -20 + bob, -13, -24 + bob);
      ctx.moveTo(0, -26 + bob);
      ctx.quadraticCurveTo(6, -20 + bob, 13, -24 + bob);
      ctx.stroke();

      ctx.restore();
    }

    function animate() {
      time += 0.016;
      ctx.clearRect(0, 0, width, height);
      drawBackground();

      const beat =
        1 +
        0.035 * Math.sin(time * 2.4) +
        0.016 * Math.sin(time * 4.8) +
        0.008 * Math.sin(time * 9.6);

      const heartX = width * 0.60;
      const heartY = height * 0.47;
      drawParticleHeart(heartX, heartY, beat);

      const cuddle = 0.5 + 0.5 * Math.sin(time * 2.4);
      drawPuppy(width * 0.36, height * 0.60, 1.28, cuddle);

      requestAnimationFrame(animate);
    }

    resize();
    makeParticles();
    animate();
    window.addEventListener("resize", () => {
      resize();
      makeParticles();
    });
  </script>
</body>
</html>
