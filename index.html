<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Love Beat</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 68% 45%, rgba(32, 0, 18, 0.24), transparent 34%),
        radial-gradient(circle at 38% 46%, rgba(36, 0, 24, 0.18), transparent 42%),
        #000;
      font-family: Arial, sans-serif;
    }

    body {
      position: relative;
    }

    canvas {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    let width = 0;
    let height = 0;
    let dpr = Math.min(window.devicePixelRatio || 1, 2);
    let time = 0;

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      dpr = Math.min(window.devicePixelRatio || 1, 2);

      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = width + "px";
      canvas.style.height = height + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    const puppyImage = new Image();
    puppyImage.src = "下載.png";

    function drawBackground() {
      const g = ctx.createRadialGradient(
        width * 0.66,
        height * 0.48,
        20,
        width / 2,
        height / 2,
        Math.max(width, height) * 0.75
      );
      g.addColorStop(0, "rgba(32, 0, 18, 0.24)");
      g.addColorStop(0.55, "rgba(10, 0, 8, 0.10)");
      g.addColorStop(1, "rgba(0, 0, 0, 1)");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, width, height);
    }

    function getPuppyFrame(beat) {
      if (width <= 620) {
        const size = Math.min(width * 0.78, height * 0.52, 320);
        return {
          x: width * 0.5,
          y: height * 0.55,
          size: size * beat,
        };
      }

      const size = Math.min(width * 0.34, height * 0.56, 390);
      return {
        x: width * 0.55,
        y: height * 0.53,
        size: size * beat,
      };
    }

    function drawPuppy(beat) {
      const frame = getPuppyFrame(beat);
      const left = frame.x - frame.size / 2;
      const top = frame.y - frame.size / 2;

      ctx.save();
      ctx.shadowBlur = 26;
      ctx.shadowColor = "rgba(255, 120, 190, 0.42)";
      ctx.drawImage(puppyImage, left, top, frame.size, frame.size);
      ctx.restore();
    }

    function animate() {
      time += 0.016;
      ctx.clearRect(0, 0, width, height);
      drawBackground();

      const beat =
        1 +
        0.018 * Math.sin(time * 2.4) +
        0.008 * Math.sin(time * 4.8);

      if (puppyImage.complete) {
        drawPuppy(beat);
      }
      requestAnimationFrame(animate);
    }

    resize();
    animate();

    window.addEventListener("resize", () => {
      resize();
    });
  </script>
</body>
</html>
