<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Love Beat · 3D Heart</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at 50% 40%, #2f0037 0%, #110017 42%, #000 100%);
      color: #fff;
    }

    #canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }

    #canvas.dragging {
      cursor: grabbing;
    }

    .hint,
    .label {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.35);
      z-index: 2;
    }

    .hint {
      top: 16px;
      font-size: 12px;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.86);
    }

    .label {
      bottom: 24px;
      font-size: 14px;
      letter-spacing: 2px;
      color: rgba(255, 255, 255, 0.92);
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="hint">Drag to rotate · Wheel to zoom · Double-click to reset</div>
  <div class="label">Love Beat · 3D</div>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d", { alpha: true });

    let width = 0;
    let height = 0;
    let dpr = Math.min(window.devicePixelRatio || 1, 2);
    let time = 0;

    const totalPoints = 3600;
    const heartPoints = [];
    const auraPoints = [];

    let rotX = -0.18;
    let rotY = 0.28;
    let targetRotX = rotX;
    let targetRotY = rotY;

    let zoom = 18;
    let targetZoom = zoom;

    let drag = false;
    let lastX = 0;
    let lastY = 0;
    let activePointerId = null;

    function heartCurve(t) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y =
        13 * Math.cos(t) -
        5 * Math.cos(2 * t) -
        2 * Math.cos(3 * t) -
        Math.cos(4 * t);
      return { x, y };
    }

    function createPoints() {
      heartPoints.length = 0;
      auraPoints.length = 0;

      for (let i = 0; i < totalPoints; i++) {
        const t = Math.random() * Math.PI * 2;
        const p = heartCurve(t);

        const shell = 0.58 + Math.pow(Math.random(), 1.4) * 0.42;
        const spread = (1 - shell) * 0.9;

        heartPoints.push({
          baseX: p.x * shell + (Math.random() - 0.5) * spread,
          baseY: p.y * shell + (Math.random() - 0.5) * spread,
          baseZ: (Math.random() - 0.5) * 10,
          hueSeed: Math.random() * 360,
          phase: Math.random() * Math.PI * 2,
          shell,
        });
      }

      for (let i = 0; i < 1100; i++) {
        const a = Math.random() * Math.PI * 2;
        const radius = 18 + Math.random() * 11;
        auraPoints.push({
          angle: a,
          radius,
          z: (Math.random() - 0.5) * 20,
          speed: 0.2 + Math.random() * 0.45,
          phase: Math.random() * Math.PI * 2,
        });
      }
    }

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = width + "px";
      canvas.style.height = height + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function rotatePoint(x, y, z, rx, ry) {
      const cosY = Math.cos(ry);
      const sinY = Math.sin(ry);
      const x1 = x * cosY + z * sinY;
      const z1 = -x * sinY + z * cosY;

      const cosX = Math.cos(rx);
      const sinX = Math.sin(rx);
      const y2 = y * cosX - z1 * sinX;
      const z2 = y * sinX + z1 * cosX;

      return { x: x1, y: y2, z: z2 };
    }

    function project(point, cameraDistance) {
      const depth = cameraDistance - point.z;
      if (depth <= 0.1) return null;
      const factor = 420 / depth;
      return {
        x: point.x * factor + width / 2,
        y: -point.y * factor + height / 2,
        factor,
      };
    }

    function drawBackground() {
      const gradient = ctx.createRadialGradient(
        width / 2,
        height * 0.45,
        30,
        width / 2,
        height * 0.5,
        Math.max(width, height) * 0.72
      );
      gradient.addColorStop(0, "rgba(90, 10, 110, 0.42)");
      gradient.addColorStop(0.45, "rgba(20, 0, 28, 0.3)");
      gradient.addColorStop(1, "rgba(0, 0, 0, 0.95)");

      ctx.globalCompositeOperation = "source-over";
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, width, height);
    }

    function drawHeart() {
      const beat =
        1 +
        0.075 * Math.sin(time * 2.4) +
        0.035 * Math.sin(time * 4.8) +
        0.015 * Math.sin(time * 9.6);

      const cameraDistance = targetZoom;
      const rendered = [];

      for (let i = 0; i < heartPoints.length; i++) {
        const p = heartPoints[i];

        const drift = Math.sin(time * 1.8 + p.phase) * (1 - p.shell) * 0.35;
        const x = p.baseX * beat + Math.cos(time + p.phase) * drift;
        const y = p.baseY * beat + Math.sin(time * 1.15 + p.phase) * drift;
        const z = p.baseZ + Math.sin(time * 1.5 + p.phase) * 0.9;

        const rotated = rotatePoint(x, y, z, rotX, rotY);
        const projected = project(rotated, cameraDistance);
        if (!projected) continue;

        const size = Math.max(1.2, projected.factor * 0.23);
        const alpha = Math.min(1, 0.3 + projected.factor * 0.035);
        const hue = (p.hueSeed + time * 55) % 360;

        rendered.push({ ...projected, size, alpha, hue, z: rotated.z });
      }

      rendered.sort((a, b) => a.z - b.z);

      ctx.globalCompositeOperation = "lighter";
      for (let i = 0; i < rendered.length; i++) {
        const p = rendered[i];
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${p.hue}, 100%, 67%, ${p.alpha})`;
        ctx.fill();
      }

      ctx.globalCompositeOperation = "source-over";
    }

    function drawAura() {
      const cameraDistance = targetZoom;
      ctx.globalCompositeOperation = "lighter";

      for (let i = 0; i < auraPoints.length; i++) {
        const p = auraPoints[i];
        const angle = p.angle + time * p.speed * 0.26;
        const radius = p.radius + Math.sin(time * 1.45 + p.phase) * 0.8;

        const x = Math.cos(angle) * radius;
        const y = Math.sin(angle) * radius;
        const z = p.z + Math.sin(time * 1.2 + p.phase) * 1.1;

        const rotated = rotatePoint(x, y, z, rotX * 0.7, rotY * 0.7);
        const projected = project(rotated, cameraDistance);
        if (!projected) continue;

        const size = Math.max(0.9, projected.factor * 0.1);
        const alpha = Math.min(0.72, 0.12 + projected.factor * 0.02);

        ctx.beginPath();
        ctx.arc(projected.x, projected.y, size, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${(320 + i * 0.05 + time * 24) % 360}, 100%, 72%, ${alpha})`;
        ctx.fill();
      }

      ctx.globalCompositeOperation = "source-over";
    }

    function animate() {
      time += 0.016;

      rotX += (targetRotX - rotX) * 0.09;
      rotY += (targetRotY - rotY) * 0.09;
      zoom += (targetZoom - zoom) * 0.14;

      if (!drag) {
        targetRotY += 0.0022;
      }

      drawBackground();
      drawAura();
      drawHeart();

      requestAnimationFrame(animate);
    }

    canvas.addEventListener("pointerdown", (e) => {
      drag = true;
      canvas.classList.add("dragging");
      lastX = e.clientX;
      lastY = e.clientY;
      activePointerId = e.pointerId;
      canvas.setPointerCapture(e.pointerId);
    });

    canvas.addEventListener("pointermove", (e) => {
      if (!drag) return;
      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;
      lastX = e.clientX;
      lastY = e.clientY;

      targetRotY += dx * 0.0045;
      targetRotX += dy * 0.0038;
      targetRotX = Math.max(-1.0, Math.min(1.0, targetRotX));
    });

    function stopDrag(e) {
      drag = false;
      canvas.classList.remove("dragging");
      if (activePointerId !== null && canvas.hasPointerCapture(activePointerId)) {
        canvas.releasePointerCapture(activePointerId);
      }
      if (e && e.pointerId === activePointerId) {
        activePointerId = null;
      }
    }

    canvas.addEventListener("pointerup", stopDrag);
    canvas.addEventListener("pointercancel", stopDrag);

    canvas.addEventListener(
      "wheel",
      (e) => {
        e.preventDefault();
        targetZoom += e.deltaY * 0.014;
        targetZoom = Math.max(11, Math.min(42, targetZoom));
      },
      { passive: false }
    );

    canvas.addEventListener("dblclick", () => {
      targetRotX = -0.18;
      targetRotY = 0.28;
      targetZoom = 18;
    });

    resize();
    createPoints();
    animate();

    window.addEventListener("resize", resize);
  </script>
</body>
</html>
