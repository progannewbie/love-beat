<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Love Beat</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 68% 45%, rgba(32, 0, 18, 0.24), transparent 34%),
        radial-gradient(circle at 38% 46%, rgba(36, 0, 24, 0.18), transparent 42%),
        #000;
      font-family: Arial, sans-serif;
    }

    body {
      position: relative;
    }

    canvas {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: block;
      width: 100%;
      height: 100%;
    }

    .puppy {
      display: none;
    }

    .puppy * {
      position: absolute;
    }

    .ear {
      top: 6%;
      width: 30%;
      height: 36%;
      border: clamp(7px, 1.3vw, 14px) solid #050505;
      border-radius: 48% 48% 42% 42%;
      background: linear-gradient(145deg, #f7dfab, #e5bf74);
      z-index: 1;
    }

    .ear.left {
      left: 14%;
      transform: rotate(-28deg);
    }

    .ear.right {
      right: 14%;
      transform: rotate(28deg);
    }

    .body {
      left: 19%;
      top: 28%;
      width: 62%;
      height: 64%;
      border: clamp(7px, 1.3vw, 14px) solid #050505;
      border-radius: 43% 43% 28% 28%;
      background: linear-gradient(145deg, #f8dfac 0%, #edcd8f 72%, #dba65d 100%);
      z-index: 2;
    }

    .body::before {
      content: "";
      position: absolute;
      left: 18%;
      top: 19%;
      width: 64%;
      height: 4.6%;
      border-radius: 999px;
      background: #ff6165;
      transform: rotate(-2deg);
    }

    .foot {
      bottom: 7%;
      width: 14%;
      height: 13%;
      border: clamp(7px, 1.3vw, 14px) solid #050505;
      border-top: 0;
      border-radius: 0 0 999px 999px;
      background: #e8bd76;
      z-index: 3;
    }

    .foot.left {
      left: 28%;
      transform: rotate(10deg);
    }

    .foot.right {
      right: 28%;
      transform: rotate(-10deg);
    }

    .eye {
      top: 40%;
      width: 7.4%;
      height: 7.4%;
      border-radius: 50%;
      background: #050505;
      z-index: 4;
    }

    .eye.left {
      left: 39%;
    }

    .eye.right {
      right: 39%;
    }

    .nose {
      left: 47.1%;
      top: 43.2%;
      width: 6.4%;
      height: 5.6%;
      border-radius: 50%;
      background: #050505;
      z-index: 4;
    }

    .mouth {
      left: 38%;
      top: 46%;
      width: 24%;
      height: 12%;
      border-bottom: clamp(5px, 0.85vw, 9px) solid #050505;
      border-radius: 0 0 999px 999px;
      z-index: 4;
    }

    .mouth::before {
      content: "";
      position: absolute;
      left: 48%;
      top: -14%;
      width: clamp(5px, 0.8vw, 9px);
      height: 42%;
      border-radius: 999px;
      background: #050505;
    }

    .paw {
      top: 57%;
      width: 28%;
      height: 16%;
      z-index: 4;
    }

    .paw::before {
      content: "";
      position: absolute;
      inset: 0;
      border: clamp(7px, 1.3vw, 14px) solid #050505;
      border-top-color: transparent;
      border-radius: 20% 20% 55% 55%;
      background: transparent;
    }

    .paw.left {
      left: 22%;
      transform: rotate(16deg);
    }

    .paw.right {
      right: 22%;
      transform: rotate(-16deg) scaleX(-1);
    }

    @media (max-width: 900px) {
      .puppy {
        right: 5%;
        width: min(40vw, 260px);
      }
    }

    @media (max-width: 620px) {
      .puppy {
        right: 50%;
        top: 58%;
        width: min(70vw, 280px);
        transform: translate(50%, -50%);
      }
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="puppy" aria-label="小狗拿著發光心跳" role="img">
    <span class="ear left"></span>
    <span class="ear right"></span>
    <span class="body"></span>
    <span class="foot left"></span>
    <span class="foot right"></span>
    <span class="eye left"></span>
    <span class="eye right"></span>
    <span class="nose"></span>
    <span class="mouth"></span>
    <span class="paw left"></span>
    <span class="paw right"></span>
  </div>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    let width = 0;
    let height = 0;
    let dpr = Math.min(window.devicePixelRatio || 1, 2);
    let time = 0;

    const edgeParticles = [];
    const glowParticles = [];
    const dustParticles = [];

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      dpr = Math.min(window.devicePixelRatio || 1, 2);

      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = width + "px";
      canvas.style.height = height + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function heartPoint(t, scale = 1) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y =
        13 * Math.cos(t) -
        5 * Math.cos(2 * t) -
        2 * Math.cos(3 * t) -
        Math.cos(4 * t);
      return { x: x * scale, y: -y * scale };
    }

    function rand(min, max) {
      return Math.random() * (max - min) + min;
    }

    function makeParticles() {
      edgeParticles.length = 0;
      glowParticles.length = 0;
      dustParticles.length = 0;

      for (let i = 0; i < 1500; i++) {
        const t = Math.random() * Math.PI * 2;
        const p = heartPoint(t, 10.8);
        edgeParticles.push({
          baseX: p.x,
          baseY: p.y,
          offset: rand(-2.5, 2.5),
          drift: rand(0, Math.PI * 2),
          size: rand(1.2, 2.3),
          alpha: rand(0.6, 0.98),
          colorType: Math.floor(rand(0, 3)),
        });
      }

      for (let i = 0; i < 700; i++) {
        const t = Math.random() * Math.PI * 2;
        const p = heartPoint(t, rand(10.3, 11.6));
        glowParticles.push({
          baseX: p.x + rand(-6, 6),
          baseY: p.y + rand(-6, 6),
          drift: rand(0, Math.PI * 2),
          size: rand(0.8, 1.6),
          alpha: rand(0.10, 0.22),
          colorType: Math.floor(rand(0, 3)),
        });
      }

      for (let i = 0; i < 180; i++) {
        const angle = Math.random() * Math.PI * 2;
        const radius = rand(50, 95);
        dustParticles.push({
          angle,
          radius,
          size: rand(0.7, 1.5),
          alpha: rand(0.04, 0.12),
          colorType: Math.floor(rand(0, 2)),
        });
      }
    }

    function getColor(type, alpha) {
      if (type === 0) return `rgba(255, 120, 190, ${alpha})`;
      if (type === 1) return `rgba(255, 175, 220, ${alpha})`;
      return `rgba(255, 240, 248, ${alpha})`;
    }

    function drawBackground() {
      const g = ctx.createRadialGradient(
        width * 0.66,
        height * 0.48,
        20,
        width / 2,
        height / 2,
        Math.max(width, height) * 0.75
      );
      g.addColorStop(0, "rgba(32, 0, 18, 0.24)");
      g.addColorStop(0.55, "rgba(10, 0, 8, 0.10)");
      g.addColorStop(1, "rgba(0, 0, 0, 1)");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, width, height);
    }

    function getHeldHeartPosition() {
      if (width <= 620) {
        const dogSize = Math.min(width * 0.72, 300);
        return {
          x: width * 0.5,
          y: height * 0.58 + dogSize * 0.12,
          scale: dogSize / 430,
          dogSize,
        };
      }

      const dogSize = width <= 900 ? Math.min(width * 0.4, 260) : Math.min(width * 0.32, 360);
      const right = width <= 900 ? width * 0.05 : width * 0.09;
      const puppyLeft = width - right - dogSize;

      return {
        x: puppyLeft + dogSize * 0.5,
        y: height * 0.51 + dogSize * 0.12,
        scale: dogSize / 360,
        dogSize,
      };
    }

    function drawDogBack(cx, heartCy, dogSize) {
      const s = dogSize / 360;
      const dogTop = heartCy - dogSize * 0.62;
      const line = 12 * s;

      ctx.save();
      ctx.lineWidth = line;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.strokeStyle = "#050505";
      ctx.shadowBlur = 18 * s;
      ctx.shadowColor = "rgba(255, 120, 190, 0.16)";

      ctx.fillStyle = "#efd090";
      ctx.beginPath();
      ctx.ellipse(cx - dogSize * 0.22, dogTop + dogSize * 0.2, dogSize * 0.13, dogSize * 0.2, -0.55, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.beginPath();
      ctx.ellipse(cx + dogSize * 0.22, dogTop + dogSize * 0.2, dogSize * 0.13, dogSize * 0.2, 0.55, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#f2d39b";
      ctx.beginPath();
      ctx.roundRect(cx - dogSize * 0.24, dogTop + dogSize * 0.22, dogSize * 0.48, dogSize * 0.61, dogSize * 0.16);
      ctx.fill();
      ctx.stroke();

      ctx.strokeStyle = "#ff6165";
      ctx.lineWidth = 7 * s;
      ctx.beginPath();
      ctx.moveTo(cx - dogSize * 0.18, dogTop + dogSize * 0.39);
      ctx.quadraticCurveTo(cx, dogTop + dogSize * 0.405, cx + dogSize * 0.18, dogTop + dogSize * 0.38);
      ctx.stroke();

      ctx.fillStyle = "#050505";
      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.arc(cx - dogSize * 0.1, dogTop + dogSize * 0.32, dogSize * 0.018, 0, Math.PI * 2);
      ctx.arc(cx + dogSize * 0.1, dogTop + dogSize * 0.32, dogSize * 0.018, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.ellipse(cx, dogTop + dogSize * 0.35, dogSize * 0.026, dogSize * 0.019, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "#050505";
      ctx.lineWidth = 7 * s;
      ctx.beginPath();
      ctx.moveTo(cx, dogTop + dogSize * 0.36);
      ctx.lineTo(cx, dogTop + dogSize * 0.39);
      ctx.quadraticCurveTo(cx - dogSize * 0.055, dogTop + dogSize * 0.43, cx - dogSize * 0.11, dogTop + dogSize * 0.39);
      ctx.moveTo(cx, dogTop + dogSize * 0.39);
      ctx.quadraticCurveTo(cx + dogSize * 0.055, dogTop + dogSize * 0.43, cx + dogSize * 0.11, dogTop + dogSize * 0.39);
      ctx.stroke();

      ctx.restore();
    }

    function drawDogFrontPaws(cx, heartCy, dogSize) {
      const s = dogSize / 360;
      const dogTop = heartCy - dogSize * 0.62;
      const pawY = dogTop + dogSize * 0.57;

      ctx.save();
      ctx.strokeStyle = "#050505";
      ctx.lineWidth = 13 * s;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.shadowBlur = 10 * s;
      ctx.shadowColor = "rgba(0, 0, 0, 0.35)";

      ctx.beginPath();
      ctx.moveTo(cx - dogSize * 0.23, pawY - dogSize * 0.02);
      ctx.quadraticCurveTo(cx - dogSize * 0.16, pawY + dogSize * 0.09, cx - dogSize * 0.02, pawY + dogSize * 0.05);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(cx + dogSize * 0.23, pawY - dogSize * 0.02);
      ctx.quadraticCurveTo(cx + dogSize * 0.16, pawY + dogSize * 0.09, cx + dogSize * 0.02, pawY + dogSize * 0.05);
      ctx.stroke();

      ctx.strokeStyle = "rgba(242, 211, 155, 0.82)";
      ctx.lineWidth = 7 * s;
      ctx.beginPath();
      ctx.moveTo(cx - dogSize * 0.215, pawY - dogSize * 0.015);
      ctx.quadraticCurveTo(cx - dogSize * 0.15, pawY + dogSize * 0.07, cx - dogSize * 0.035, pawY + dogSize * 0.045);
      ctx.moveTo(cx + dogSize * 0.215, pawY - dogSize * 0.015);
      ctx.quadraticCurveTo(cx + dogSize * 0.15, pawY + dogSize * 0.07, cx + dogSize * 0.035, pawY + dogSize * 0.045);
      ctx.stroke();

      ctx.restore();
    }

    function drawHeartbeatLine(cx, cy, beat, scale) {
      const points = [
        [-70, 0],
        [-42, 0],
        [-32, -18],
        [-20, 24],
        [-8, -34],
        [6, 0],
        [28, 0],
        [38, -14],
        [50, 0],
        [70, 0],
      ];

      ctx.save();
      ctx.translate(cx, cy + 6 * scale);
      ctx.scale(scale * beat, scale * beat);
      ctx.beginPath();
      points.forEach(([x, y], index) => {
        if (index === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.lineWidth = 5;
      ctx.lineJoin = "round";
      ctx.lineCap = "round";
      ctx.strokeStyle = "rgba(255, 245, 252, 0.96)";
      ctx.shadowBlur = 18;
      ctx.shadowColor = "rgba(255, 120, 190, 0.95)";
      ctx.stroke();
      ctx.restore();
    }

    function drawParticleHeart(cx, cy, beat, scale = 1) {
      for (const p of glowParticles) {
        const moveX = Math.cos(time * 0.8 + p.drift) * 1.6;
        const moveY = Math.sin(time * 0.8 + p.drift) * 1.6;
        const x = cx + (p.baseX + moveX) * beat * scale;
        const y = cy + (p.baseY + moveY) * beat * scale;
        ctx.beginPath();
        ctx.arc(x, y, p.size * scale, 0, Math.PI * 2);
        ctx.fillStyle = getColor(p.colorType, p.alpha);
        ctx.shadowBlur = 13;
        ctx.shadowColor = getColor(p.colorType, Math.min(1, p.alpha + 0.16));
        ctx.fill();
      }

      for (const p of edgeParticles) {
        const jitterX = Math.cos(time * 1.4 + p.drift) * p.offset * 0.22;
        const jitterY = Math.sin(time * 1.7 + p.drift) * p.offset * 0.22;
        const x = cx + (p.baseX + jitterX) * beat * scale;
        const y = cy + (p.baseY + jitterY) * beat * scale;
        ctx.beginPath();
        ctx.arc(x, y, p.size * scale, 0, Math.PI * 2);
        ctx.fillStyle = getColor(p.colorType, p.alpha);
        ctx.shadowBlur = 9;
        ctx.shadowColor = getColor(p.colorType, Math.min(1, p.alpha + 0.12));
        ctx.fill();
      }

      for (const p of dustParticles) {
        const swirl = time * 0.07 + p.angle;
        const x = cx + Math.cos(swirl) * p.radius * scale;
        const y = cy + Math.sin(swirl) * p.radius * 0.72 * scale;
        ctx.beginPath();
        ctx.arc(x, y, p.size * scale, 0, Math.PI * 2);
        ctx.fillStyle = getColor(p.colorType, p.alpha);
        ctx.shadowBlur = 5;
        ctx.shadowColor = getColor(p.colorType, p.alpha);
        ctx.fill();
      }

      drawHeartbeatLine(cx, cy, beat, scale);
    }

    function animate() {
      time += 0.016;
      ctx.clearRect(0, 0, width, height);
      drawBackground();

      const beat =
        1 +
        0.032 * Math.sin(time * 2.4) +
        0.014 * Math.sin(time * 4.8) +
        0.006 * Math.sin(time * 9.6);

      const heldHeart = getHeldHeartPosition();
      drawDogBack(heldHeart.x, heldHeart.y, heldHeart.dogSize);
      drawParticleHeart(heldHeart.x, heldHeart.y, beat, heldHeart.scale);
      drawDogFrontPaws(heldHeart.x, heldHeart.y, heldHeart.dogSize);
      requestAnimationFrame(animate);
    }

    resize();
    makeParticles();
    animate();

    window.addEventListener("resize", () => {
      resize();
      makeParticles();
    });
  </script>
</body>
</html>
