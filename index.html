<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Love Beat - Three.js Rainbow</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at center, #111 0%, #000 65%);
      font-family: Arial, sans-serif;
    }

    canvas {
      display: block;
    }

    .label {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.78);
      font-size: 14px;
      letter-spacing: 2px;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.35);
      pointer-events: none;
      z-index: 2;
    }

    .hint {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.55);
      font-size: 12px;
      letter-spacing: 1px;
      pointer-events: none;
      z-index: 2;
    }
  </style>
</head>
<body>
  <div class="hint">拖曳旋轉 · 滾輪縮放</div>
  <div class="label">Love Beat · Rainbow 3D</div>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
    import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);

    const camera = new THREE.PerspectiveCamera(
      60,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );
    camera.position.set(0, 0, 26);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.enablePan = false;
    controls.enableZoom = true;
    controls.rotateSpeed = 0.9;
    controls.zoomSpeed = 1.0;
    controls.minDistance = 10;
    controls.maxDistance = 45;
    controls.minPolarAngle = Math.PI * 0.15;
    controls.maxPolarAngle = Math.PI * 0.85;
    controls.target.set(0, 0, 0);

    const group = new THREE.Group();
    scene.add(group);

    const glowLight = new THREE.PointLight(0xffffff, 3.2, 220);
    glowLight.position.set(0, 0, 28);
    scene.add(glowLight);

    const light2 = new THREE.PointLight(0xffffff, 1.8, 180);
    light2.position.set(0, 12, -18);
    scene.add(light2);

    const ambient = new THREE.AmbientLight(0xffffff, 1.1);
    scene.add(ambient);

    function heartPoint(t, scale = 1) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y =
        13 * Math.cos(t) -
        5 * Math.cos(2 * t) -
        2 * Math.cos(3 * t) -
        Math.cos(4 * t);

      return new THREE.Vector3(x * scale, y * scale, 0);
    }

    const color = new THREE.Color();

    const pointCount = 9000;
    const positions = new Float32Array(pointCount * 3);
    const colors = new Float32Array(pointCount * 3);
    const seeds = [];

    for (let i = 0; i < pointCount; i++) {
      const t = Math.random() * Math.PI * 2;
      const heartScale = 0.9 + Math.random() * 0.2;
      const base = heartPoint(t, heartScale);

      const shell = 0.55 + Math.pow(Math.random(), 1.2) * 0.45;
      const jitter = (1 - shell) * 0.7;

      const x = base.x * shell + (Math.random() - 0.5) * jitter;
      const y = base.y * shell + (Math.random() - 0.5) * jitter;
      const z = (Math.random() - 0.5) * 4.5;

      positions[i * 3] = x;
      positions[i * 3 + 1] = y;
      positions[i * 3 + 2] = z;

      const hue = (i / pointCount) * 360;
      color.setHSL(hue / 360, 1, 0.68);
      colors[i * 3] = color.r;
      colors[i * 3 + 1] = color.g;
      colors[i * 3 + 2] = color.b;

      seeds.push({
        t,
        shell,
        driftSeed: Math.random() * Math.PI * 2,
        depth: z
      });
    }

    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute("color", new THREE.BufferAttribute(colors, 3));

    const material = new THREE.PointsMaterial({
      size: 0.42,
      vertexColors: true,
      transparent: true,
      opacity: 1,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    const heart = new THREE.Points(geometry, material);
    group.add(heart);

    const auraCount = 2200;
    const auraPositions = new Float32Array(auraCount * 3);
    const auraColors = new Float32Array(auraCount * 3);
    const auraSeeds = [];

    for (let i = 0; i < auraCount; i++) {
      const angle = Math.random() * Math.PI * 2;
      const radius = 15 + Math.random() * 10;
      const z = (Math.random() - 0.5) * 12;

      auraPositions[i * 3] = Math.cos(angle) * radius;
      auraPositions[i * 3 + 1] = Math.sin(angle) * radius;
      auraPositions[i * 3 + 2] = z;

      const hue = ((angle / (Math.PI * 2)) * 360 + i * 0.1) % 360;
      color.setHSL(hue / 360, 1, 0.72);
      auraColors[i * 3] = color.r;
      auraColors[i * 3 + 1] = color.g;
      auraColors[i * 3 + 2] = color.b;

      auraSeeds.push({
        angle,
        radius,
        speed: 0.12 + Math.random() * 0.3,
        floatSeed: Math.random() * Math.PI * 2,
        z
      });
    }

    const auraGeometry = new THREE.BufferGeometry();
    auraGeometry.setAttribute("position", new THREE.BufferAttribute(auraPositions, 3));
    auraGeometry.setAttribute("color", new THREE.BufferAttribute(auraColors, 3));

    const auraMaterial = new THREE.PointsMaterial({
      size: 0.26,
      vertexColors: true,
      transparent: true,
      opacity: 0.75,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    const aura = new THREE.Points(auraGeometry, auraMaterial);
    group.add(aura);

    const haloGeometry = new THREE.RingGeometry(10.8, 11.8, 128);
    const haloMaterial = new THREE.MeshBasicMaterial({
      color: 0xffffff,
      transparent: true,
      opacity: 0.12,
      side: THREE.DoubleSide
    });
    const halo = new THREE.Mesh(haloGeometry, haloMaterial);
    halo.rotation.x = Math.PI / 2;
    halo.position.z = -4;
    group.add(halo);

    const clock = new THREE.Clock();
    let userInteracting = false;

    controls.addEventListener("start", () => {
      userInteracting = true;
    });

    controls.addEventListener("end", () => {
      userInteracting = false;
    });

    function animate() {
      requestAnimationFrame(animate);

      const t = clock.getElapsedTime();
      const beat =
        1 +
        0.07 * Math.sin(t * 2.5) +
        0.035 * Math.sin(t * 5.0) +
        0.018 * Math.sin(t * 10.0);

      const pos = geometry.attributes.position.array;
      const col = geometry.attributes.color.array;

      for (let i = 0; i < pointCount; i++) {
        const seed = seeds[i];
        const base = heartPoint(seed.t, beat);

        pos[i * 3] =
          base.x * seed.shell + Math.cos(t * 1.6 + seed.driftSeed) * 0.08;

        pos[i * 3 + 1] =
          base.y * seed.shell + Math.sin(t * 1.8 + seed.driftSeed) * 0.08;

        pos[i * 3 + 2] =
          seed.depth + Math.sin(t * 2.0 + seed.driftSeed) * 0.25;

        const hue = ((i / pointCount) * 360 + t * 55) % 360;
        color.setHSL(hue / 360, 1, 0.68);
        col[i * 3] = color.r;
        col[i * 3 + 1] = color.g;
        col[i * 3 + 2] = color.b;
      }

      geometry.attributes.position.needsUpdate = true;
      geometry.attributes.color.needsUpdate = true;

      const auraPos = auraGeometry.attributes.position.array;
      const auraCol = auraGeometry.attributes.color.array;

      for (let i = 0; i < auraCount; i++) {
        const seed = auraSeeds[i];
        const a = seed.angle + t * seed.speed * 0.2;
        const r = seed.radius + Math.sin(t * 1.4 + seed.floatSeed) * 0.45;

        auraPos[i * 3] = Math.cos(a) * r;
        auraPos[i * 3 + 1] = Math.sin(a) * r;
        auraPos[i * 3 + 2] = seed.z + Math.sin(t * 1.2 + seed.floatSeed) * 0.4;

        const hue = (((a / (Math.PI * 2)) * 360) + t * 25 + i * 0.02) % 360;
        color.setHSL(hue / 360, 1, 0.74);
        auraCol[i * 3] = color.r;
        auraCol[i * 3 + 1] = color.g;
        auraCol[i * 3 + 2] = color.b;
      }

      auraGeometry.attributes.position.needsUpdate = true;
      auraGeometry.attributes.color.needsUpdate = true;

      halo.material.opacity = 0.08 + Math.abs(Math.sin(t * 2.5)) * 0.06;
      halo.scale.setScalar(beat * 1.02);

      if (!userInteracting) {
        group.rotation.y += 0.002;
        group.rotation.x = Math.sin(t * 0.4) * 0.05;
      }

      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
