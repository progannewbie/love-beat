<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Love Beat</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .label {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      color: rgba(255, 230, 245, 0.85);
      font-size: 14px;
      letter-spacing: 2px;
      text-shadow: 0 0 12px rgba(255, 100, 180, 0.45);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="label">Love Beat</div>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    let width = 0;
    let height = 0;
    let dpr = Math.min(window.devicePixelRatio || 1, 2);
    let time = 0;

    const edgeParticles = [];
    const glowParticles = [];
    const dustParticles = [];

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;

      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = width + "px";
      canvas.style.height = height + "px";

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function heartPoint(t, scale = 1) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y =
        13 * Math.cos(t) -
        5 * Math.cos(2 * t) -
        2 * Math.cos(3 * t) -
        Math.cos(4 * t);

      return {
        x: x * scale,
        y: -y * scale,
      };
    }

    function rand(min, max) {
      return Math.random() * (max - min) + min;
    }

    function makeParticles() {
      edgeParticles.length = 0;
      glowParticles.length = 0;
      dustParticles.length = 0;

      for (let i = 0; i < 2200; i++) {
        const t = Math.random() * Math.PI * 2;
        const p = heartPoint(t, 11.5);

        edgeParticles.push({
          t,
          baseX: p.x,
          baseY: p.y,
          offset: rand(-6, 6),
          drift: rand(0, Math.PI * 2),
          size: rand(1.2, 2.7),
          alpha: rand(0.45, 0.95),
          colorType: Math.floor(rand(0, 3)),
        });
      }

      for (let i = 0; i < 1600; i++) {
        const t = Math.random() * Math.PI * 2;
        const p = heartPoint(t, rand(10.5, 13.5));

        glowParticles.push({
          t,
          baseX: p.x + rand(-14, 14),
          baseY: p.y + rand(-14, 14),
          drift: rand(0, Math.PI * 2),
          size: rand(1, 2.4),
          alpha: rand(0.12, 0.4),
          colorType: Math.floor(rand(0, 3)),
        });
      }

      for (let i = 0; i < 900; i++) {
        const angle = Math.random() * Math.PI * 2;
        const radius = rand(70, 170);

        dustParticles.push({
          angle,
          radius,
          drift: rand(0, Math.PI * 2),
          size: rand(0.8, 2.2),
          alpha: rand(0.08, 0.3),
          colorType: Math.floor(rand(0, 3)),
        });
      }
    }

    function getColor(type, alpha) {
      if (type === 0) return `rgba(255, 105, 180, ${alpha})`;
      if (type === 1) return `rgba(255, 160, 220, ${alpha})`;
      return `rgba(255, 235, 245, ${alpha})`;
    }

    function drawBackground() {
      const g = ctx.createRadialGradient(
        width / 2,
        height / 2,
        20,
        width / 2,
        height / 2,
        Math.max(width, height) * 0.7
      );

      g.addColorStop(0, "rgba(25, 0, 18, 0.20)");
      g.addColorStop(0.5, "rgba(8, 0, 8, 0.10)");
      g.addColorStop(1, "rgba(0, 0, 0, 1)");

      ctx.fillStyle = g;
      ctx.fillRect(0, 0, width, height);
    }

    function drawParticleHeart() {
      const cx = width / 2;
      const cy = height / 2 - 10;

      const beat =
        1 +
        0.045 * Math.sin(time * 2.4) +
        0.02 * Math.sin(time * 4.8) +
        0.01 * Math.sin(time * 9.6);

      for (const p of glowParticles) {
        const moveX = Math.cos(time * 0.8 + p.drift) * 3;
        const moveY = Math.sin(time * 0.8 + p.drift) * 3;

        const x = cx + (p.baseX + moveX) * beat;
        const y = cy + (p.baseY + moveY) * beat;

        ctx.beginPath();
        ctx.arc(x, y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = getColor(p.colorType, p.alpha);
        ctx.shadowBlur = 18;
        ctx.shadowColor = getColor(p.colorType, Math.min(1, p.alpha + 0.2));
        ctx.fill();
      }

      for (const p of edgeParticles) {
        const pulse = 1 + 0.03 * Math.sin(time * 3 + p.drift);
        const jitterX = Math.cos(time * 1.6 + p.drift) * p.offset * 0.15;
        const jitterY = Math.sin(time * 1.8 + p.drift) * p.offset * 0.15;

        const x = cx + (p.baseX + jitterX) * beat * pulse;
        const y = cy + (p.baseY + jitterY) * beat * pulse;

        ctx.beginPath();
        ctx.arc(x, y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = getColor(p.colorType, p.alpha);
        ctx.shadowBlur = 10;
        ctx.shadowColor = getColor(p.colorType, Math.min(1, p.alpha + 0.2));
        ctx.fill();
      }

      for (const p of dustParticles) {
        const swirl = time * 0.12 + p.angle;
        const x = cx + Math.cos(swirl) * p.radius;
        const y = cy + Math.sin(swirl) * p.radius * 0.7;

        ctx.beginPath();
        ctx.arc(x, y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = getColor(p.colorType, p.alpha);
        ctx.shadowBlur = 8;
        ctx.shadowColor = getColor(p.colorType, p.alpha);
        ctx.fill();
      }
    }

    function drawText() {
      ctx.save();
      ctx.textAlign = "center";
      ctx.font = "16px Arial";
      ctx.fillStyle = "rgba(255, 220, 240, 0.8)";
      ctx.shadowBlur = 12;
      ctx.shadowColor = "rgba(255, 105, 180, 0.8)";
      ctx.fillText("Love Beat", width / 2, height - 28);
      ctx.restore();
    }

    function animate() {
      time += 0.016;

      ctx.clearRect(0, 0, width, height);
      drawBackground();
      drawParticleHeart();
      drawText();

      requestAnimationFrame(animate);
    }

    resize();
    makeParticles();
    animate();

    window.addEventListener("resize", () => {
      resize();
      makeParticles();
    });
  </script>
</body>
</html>
