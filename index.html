<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Love Beat</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .label {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.82);
      font-size: 14px;
      letter-spacing: 2px;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.35);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="label">Love Beat</div>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    let width = 0;
    let height = 0;
    let dpr = Math.min(window.devicePixelRatio || 1, 2);
    let time = 0;

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;

      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = width + "px";
      canvas.style.height = height + "px";

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function heartPoint(t, scale) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y =
        13 * Math.cos(t) -
        5 * Math.cos(2 * t) -
        2 * Math.cos(3 * t) -
        Math.cos(4 * t);

      return {
        x: x * scale,
        y: -y * scale,
      };
    }

    function hsl(h, s = 100, l = 60, a = 1) {
      return `hsla(${h}, ${s}%, ${l}%, ${a})`;
    }

    function drawBackground() {
      const g = ctx.createRadialGradient(
        width / 2,
        height / 2,
        10,
        width / 2,
        height / 2,
        Math.max(width, height) * 0.8
      );

      g.addColorStop(0, "rgba(30, 30, 40, 0.35)");
      g.addColorStop(0.45, "rgba(10, 10, 20, 0.18)");
      g.addColorStop(1, "rgba(0, 0, 0, 1)");

      ctx.fillStyle = g;
      ctx.fillRect(0, 0, width, height);
    }

    function drawGlowHeart(scalePulse) {
      const cx = width / 2;
      const cy = height / 2;
      const baseScale = Math.min(width, height) * 0.015 * scalePulse;
      const hueBase = (time * 80) % 360;

      ctx.save();
      ctx.translate(cx, cy);

      for (let layer = 0; layer < 7; layer++) {
        const alpha = 0.05 + layer * 0.03;
        const spread = 1 + layer * 0.12;
        const hue = (hueBase + layer * 25) % 360;

        ctx.beginPath();
        for (let i = 0; i <= Math.PI * 2 + 0.01; i += 0.02) {
          const p = heartPoint(i, baseScale * spread);
          if (i === 0) ctx.moveTo(p.x, p.y);
          else ctx.lineTo(p.x, p.y);
        }
        ctx.closePath();

        ctx.shadowBlur = 28 + layer * 12;
        ctx.shadowColor = hsl(hue, 100, 60, alpha);
        ctx.fillStyle = hsl(hue, 90, 55, alpha);
        ctx.fill();
      }

      ctx.beginPath();
      for (let i = 0; i <= Math.PI * 2 + 0.01; i += 0.02) {
        const p = heartPoint(i, baseScale);
        if (i === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      }
      ctx.closePath();

      const fillGradient = ctx.createLinearGradient(0, -160, 0, 160);
      fillGradient.addColorStop(0, hsl((hueBase + 0) % 360, 100, 72, 1));
      fillGradient.addColorStop(0.25, hsl((hueBase + 60) % 360, 100, 65, 1));
      fillGradient.addColorStop(0.5, hsl((hueBase + 140) % 360, 100, 60, 1));
      fillGradient.addColorStop(0.75, hsl((hueBase + 220) % 360, 100, 62, 1));
      fillGradient.addColorStop(1, hsl((hueBase + 300) % 360, 100, 68, 1));

      ctx.shadowBlur = 36;
      ctx.shadowColor = hsl((hueBase + 40) % 360, 100, 65, 0.95);
      ctx.fillStyle = fillGradient;
      ctx.fill();

      ctx.lineWidth = 2;
      ctx.strokeStyle = "rgba(255,255,255,0.9)";
      ctx.stroke();

      ctx.restore();
    }

    function drawParticles(scalePulse) {
      const cx = width / 2;
      const cy = height / 2;
      const baseScale = Math.min(width, height) * 0.015 * scalePulse;

      for (let i = 0; i < 260; i++) {
        const t = (i / 260) * Math.PI * 2;
        const p = heartPoint(t, baseScale * (0.86 + Math.random() * 0.3));

        const flicker = 0.5 + 0.5 * Math.sin(time * 4 + i * 0.35);
        const size = 1 + flicker * 2.2;
        const offsetX = Math.sin(time * 2.1 + i * 0.23) * 4;
        const offsetY = Math.cos(time * 1.8 + i * 0.17) * 4;
        const hue = (time * 120 + i * 4) % 360;

        ctx.beginPath();
        ctx.arc(cx + p.x + offsetX, cy + p.y + offsetY, size, 0, Math.PI * 2);

        ctx.shadowBlur = 10 + flicker * 6;
        ctx.shadowColor = hsl(hue, 100, 60, 0.9);
        ctx.fillStyle = hsl(hue, 100, 70, 0.35 + flicker * 0.45);
        ctx.fill();
      }
    }

    function drawAura(scalePulse) {
      const cx = width / 2;
      const cy = height / 2;
      const r = Math.min(width, height) * 0.18 * scalePulse;
      const hueBase = (time * 70) % 360;

      const g = ctx.createRadialGradient(cx, cy, r * 0.2, cx, cy, r);
      g.addColorStop(0, hsl((hueBase + 40) % 360, 100, 60, 0.18));
      g.addColorStop(0.5, hsl((hueBase + 180) % 360, 100, 55, 0.1));
      g.addColorStop(1, "rgba(0,0,0,0)");

      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawText() {
      ctx.save();
      ctx.textAlign = "center";
      ctx.font = "16px Arial";
      ctx.fillStyle = "rgba(255,255,255,0.75)";
      ctx.shadowBlur = 12;
      ctx.shadowColor = hsl((time * 100) % 360, 100, 65, 0.9);
      ctx.fillText("Love Beat", width / 2, height - 30);
      ctx.restore();
    }

    function animate() {
      time += 0.03;

      ctx.clearRect(0, 0, width, height);
      drawBackground();

      const beat =
        1 +
        0.08 * Math.sin(time * 2.2) +
        0.05 * Math.sin(time * 4.4) +
        0.025 * Math.sin(time * 8.8);

      drawAura(beat);
      drawParticles(beat);
      drawGlowHeart(beat);
      drawText();

      requestAnimationFrame(animate);
    }

    resize();
    animate();
    window.addEventListener("resize", resize);
  </script>
</body>
</html>
