<script type="module">
  import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
  import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js";

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x000000);

  const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
  );
  camera.position.set(0, 0, 38);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.enablePan = false;
  controls.enableZoom = true;
  controls.minDistance = 18;
  controls.maxDistance = 80;
  controls.autoRotate = false;
  controls.target.set(0, 0, 0);

  const group = new THREE.Group();
  scene.add(group);

  const glowLight = new THREE.PointLight(0xffffff, 2.2, 200);
  glowLight.position.set(0, 0, 30);
  scene.add(glowLight);

  const ambient = new THREE.AmbientLight(0xffffff, 0.8);
  scene.add(ambient);

  function heartPoint(t, scale = 1) {
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y =
      13 * Math.cos(t) -
      5 * Math.cos(2 * t) -
      2 * Math.cos(3 * t) -
      Math.cos(4 * t);

    return new THREE.Vector3(x * scale, y * scale, 0);
  }

  const pointCount = 5000;
  const positions = new Float32Array(pointCount * 3);
  const colors = new Float32Array(pointCount * 3);
  const seeds = [];
  const color = new THREE.Color();

  for (let i = 0; i < pointCount; i++) {
    const t = Math.random() * Math.PI * 2;
    const base = heartPoint(t, 0.9 + Math.random() * 0.35);

    const depth = (Math.random() - 0.5) * 8;
    const spread = (Math.random() - 0.5) * 1.4;

    positions[i * 3] = base.x + spread;
    positions[i * 3 + 1] = base.y + spread;
    positions[i * 3 + 2] = depth;

    const hue = (i / pointCount) * 360;
    color.setHSL(hue / 360, 1, 0.6);
    colors[i * 3] = color.r;
    colors[i * 3 + 1] = color.g;
    colors[i * 3 + 2] = color.b;

    seeds.push({
      t,
      offset: Math.random() * Math.PI * 2,
      radius: 0.5 + Math.random() * 1.5,
      depth,
    });
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute("color", new THREE.BufferAttribute(colors, 3));

  const material = new THREE.PointsMaterial({
    size: 0.28,
    vertexColors: true,
    transparent: true,
    opacity: 0.95,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
  });

  const heartPoints = new THREE.Points(geometry, material);
  group.add(heartPoints);

  const outerCount = 1200;
  const outerPositions = new Float32Array(outerCount * 3);
  const outerColors = new Float32Array(outerCount * 3);
  const outerSeeds = [];

  for (let i = 0; i < outerCount; i++) {
    const angle = Math.random() * Math.PI * 2;
    const radius = 18 + Math.random() * 10;
    const z = (Math.random() - 0.5) * 20;

    outerPositions[i * 3] = Math.cos(angle) * radius;
    outerPositions[i * 3 + 1] = Math.sin(angle) * radius;
    outerPositions[i * 3 + 2] = z;

    const hue = (angle / (Math.PI * 2)) * 360;
    color.setHSL(hue / 360, 1, 0.65);
    outerColors[i * 3] = color.r;
    outerColors[i * 3 + 1] = color.g;
    outerColors[i * 3 + 2] = color.b;

    outerSeeds.push({
      angle,
      radius,
      speed: 0.2 + Math.random() * 0.5,
      z,
    });
  }

  const outerGeometry = new THREE.BufferGeometry();
  outerGeometry.setAttribute("position", new THREE.BufferAttribute(outerPositions, 3));
  outerGeometry.setAttribute("color", new THREE.BufferAttribute(outerColors, 3));

  const outerMaterial = new THREE.PointsMaterial({
    size: 0.2,
    vertexColors: true,
    transparent: true,
    opacity: 0.55,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
  });

  const aura = new THREE.Points(outerGeometry, outerMaterial);
  group.add(aura);

  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);

    const t = clock.getElapsedTime();
    const beat =
      1 +
      0.06 * Math.sin(t * 2.4) +
      0.03 * Math.sin(t * 4.8) +
      0.015 * Math.sin(t * 9.6);

    const pos = geometry.attributes.position.array;
    const col = geometry.attributes.color.array;

    for (let i = 0; i < pointCount; i++) {
      const seed = seeds[i];
      const p = heartPoint(seed.t, beat * (0.92 + seed.radius * 0.08));

      const wave = Math.sin(t * 2 + seed.offset) * 0.6;
      pos[i * 3] = p.x + Math.cos(seed.offset + t) * 0.25;
      pos[i * 3 + 1] = p.y + Math.sin(seed.offset + t * 1.2) * 0.25;
      pos[i * 3 + 2] = seed.depth + wave;

      const hue = ((i / pointCount) * 360 + t * 80) % 360;
      color.setHSL(hue / 360, 1, 0.62);
      col[i * 3] = color.r;
      col[i * 3 + 1] = color.g;
      col[i * 3 + 2] = color.b;
    }

    geometry.attributes.position.needsUpdate = true;
    geometry.attributes.color.needsUpdate = true;

    const outerPos = outerGeometry.attributes.position.array;
    const outerCol = outerGeometry.attributes.color.array;

    for (let i = 0; i < outerCount; i++) {
      const seed = outerSeeds[i];
      const a = seed.angle + t * seed.speed * 0.2;
      const r = seed.radius + Math.sin(t * 2 + i * 0.05) * 0.6;

      outerPos[i * 3] = Math.cos(a) * r;
      outerPos[i * 3 + 1] = Math.sin(a) * r;
      outerPos[i * 3 + 2] = seed.z + Math.sin(t + i * 0.08) * 0.8;

      const hue = (((a % (Math.PI * 2)) / (Math.PI * 2)) * 360 + t * 40) % 360;
      color.setHSL(hue / 360, 1, 0.65);
      outerCol[i * 3] = color.r;
      outerCol[i * 3 + 1] = color.g;
      outerCol[i * 3 + 2] = color.b;
    }

    outerGeometry.attributes.position.needsUpdate = true;
    outerGeometry.attributes.color.needsUpdate = true;

    group.rotation.y += 0.003;
    group.rotation.x = Math.sin(t * 0.6) * 0.12;

    controls.update();
    renderer.render(scene, camera);
  }

  animate();

  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
